name: Preserve fault history V3

on:
  push:
    branches: [main]
    paths:
      - '**.xlsx'
      - '**alarm_history.json'
      - 'fault_core.py'
      - 'build_data.py'
      - 'sync_history.py'
      - 'requirements-build.txt'
      - '.github/workflows/fault-snapshot-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fault-history-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements-build.txt

      - run: python sync_history.py

      - name: Save history
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v3 archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve OOS history and refresh V3 snapshot'
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          exit 1
